<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartyQuiz - Host</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0c10;
            color: #c5c6c7;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #66fcf1; font-size: 36px; margin-bottom: 10px; }
        
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .room-code-box {
            background: #1f2833;
            border: 3px solid #66fcf1;
            display: inline-block;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            color: #45a29e;
            margin: 10px 0;
        }

        #qrcode {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
            margin: 10px 0;
        }

        .players-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .player-card {
            background: #1f2833;
            border: 2px solid #45a29e;
            border-radius: 10px;
            padding: 15px 25px;
            min-width: 120px;
        }

        .player-card.ready {
            border-color: #28a745;
            background: #143d22;
        }

        .player-name { font-size: 20px; font-weight: bold; color: #fff; }
        .player-score { font-size: 18px; color: #ffeb3b; }
        
        .btn-action {
            background: #45a29e;
            color: #0b0c10;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-action:hover { background: #66fcf1; }

        .question-box {
            background: #1f2833;
            border: 2px solid #ffeb3b;
            padding: 25px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 650px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .option-item {
            padding: 15px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 8px;
            font-size: 18px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>PartyQuiz Host Screen</h1>

    <div id="setup-screen" class="setup-container">
        <p style="font-size: 20px; margin-bottom: 0;">Κωδικός Δωματίου:</p>
        <div class="room-code-box" id="room-code">Δημιουργία...</div>
        
        <div id="qrcode"></div>
        <p style="font-size: 14px; color: #888; margin-top: -5px;">Σκανάρετε με το κινητό σας για άμεση σύνδεση</p>

        <p id="difficulty-display" style="color: #66fcf1; font-weight: bold;">Δυσκολία: EASY</p>
        <p id="status-message" style="color: #ffeb3b; font-size: 20px; font-weight: bold;"></p>
        
        <h3>Συνδεδεμένοι Παίκτες:</h3>
        <div class="players-container" id="players-list">
            <p style="color: #888;">Αναμονή για παίκτες...</p>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="question-box">
            <h2 id="round-title" style="color: #66fcf1;"></h2>
            <h3 id="question-text" style="color: #fff; font-size: 24px;"></h3>
            <div class="options-grid" id="options-grid"></div>
            <button class="btn-action" id="enable-btn" onclick="enableAnswers()">🔔 Ενεργοποίηση Απαντήσεων στους Παίκτες</button>
        </div>
    </div>

    <div id="results-screen" style="display: none;">
        <h2>Αποτελέσματα Γύρου</h2>
        <p id="correct-answer-text" style="color: #28a745; font-size: 24px; font-weight: bold;"></p>
        <div class="players-container" id="results-players-list"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomId = null;

        socket.emit('create-room');

        socket.on('room-created', (data) => {
            currentRoomId = data.roomId;
            document.getElementById('room-code').innerText = currentRoomId;

            const playerUrl = `${window.location.origin}/player.html?room=${currentRoomId}`;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: playerUrl,
                width: 160,
                height: 160,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        socket.on('difficulty-updated', (data) => {
            document.getElementById('difficulty-display').innerText = `Δυσκολία: ${data.difficulty.toUpperCase()}`;
        });

        socket.on('update-players', (players) => {
            const container = document.getElementById('players-list');
            if (players.length === 0) {
                container.innerHTML = '<p style="color: #888;">Αναμονή για παίκτες...</p>';
                return;
            }
            container.innerHTML = players.map(p => `
                <div class="player-card ${p.ready ? 'ready' : ''}">
                    <div class="player-name">${p.name} ${p.isFirstPlayer ? '👑' : ''}</div>
                    <div class="player-score">${p.score} pts</div>
                    <div style="font-size: 14px; margin-top: 5px; color: ${p.ready ? '#28a745' : '#aaa'}">
                        ${p.ready ? '✅ ΕΤΟΙΜΟΣ' : '⏳ Αναμονή...'}
                    </div>
                </div>
            `).join('');
        });

        socket.on('category-selection-started', (data) => {
            document.getElementById('status-message').innerText = `🎯 Ο/Η "${data.chooserName}" επιλέγει κατηγορία...`;
        });

        socket.on('new-question-host', (data) => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            document.getElementById('round-title').innerText = `Γύρος ${data.round} - ${data.category}`;
            document.getElementById('question-text').innerText = data.question;
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = data.options.map((opt, idx) => `
                <div class="option-item"><strong>${String.fromCharCode(65 + idx)}:</strong> ${opt}</div>
            `).join('');

            document.getElementById('enable-btn').style.display = 'inline-block';
        });

        function enableAnswers() {
            socket.emit('enable-answers-host', { roomId: currentRoomId });
            document.getElementById('enable-btn').style.display = 'none';
        }

        socket.on('round-results', (data) => {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';

            document.getElementById('correct-answer-text').innerText = `Σωστή Απάντηση: Επιλογή ${String.fromCharCode(65 + data.correctIndex)}`;

            const container = document.getElementById('results-players-list');
            container.innerHTML = data.players.map(p => `
                <div class="player-card">
                    <div class="player-name">${p.name}</div>
                    <div class="player-score">${p.score} pts</div>
                </div>
            `).join('');

            setTimeout(() => {
                document.getElementById('results-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
                document.getElementById('status-message').innerText = "";
            }, 4000);
        });
    </script>
</body>
</html>
