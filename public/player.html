<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PartyQuiz Controller</title>
    <style>
        * { 
            box-sizing: border-box; 
            touch-action: manipulation; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 10px;
            overflow: hidden;
            background: #121212;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            position: fixed;
        }
        
        .login-box { max-width: 320px; margin: 40px auto; display: flex; flex-direction: column; gap: 15px; }
        input, button { padding: 15px; font-size: 18px; border-radius: 10px; border: none; }
        input { text-align: center; font-weight: bold; -webkit-user-select: auto; user-select: auto; }
        .btn-join { background: #2ecc71; color: white; font-weight: bold; cursor: pointer; }

        .buzz-controller {
            max-width: 340px;
            height: calc(100vh - 20px);
            margin: 0 auto;
            background: #222;
            border: 4px solid #444;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .player-info { 
            background: #333; 
            width: 100%; 
            padding: 10px; 
            border-radius: 12px; 
            font-weight: bold; 
            color: #66fcf1;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status-msg { height: 28px; font-weight: bold; color: #ffeb3b; font-size: 16px; margin: 5px 0; }

        .red-buzzer {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            border: 6px solid #800000;
            border-radius: 50%;
            box-shadow: 0 8px 0 #500000;
            cursor: pointer;
            margin: 5px 0;
            outline: none;
        }
        .red-buzzer:active { transform: translateY(6px); box-shadow: 0 2px 0 #500000; }

        .buzz-buttons { width: 100%; display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; }

        .buzz-btn {
            width: 100%;
            flex: 1;
            max-height: 65px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
            font-size: 16px;
            font-weight: bold;
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            transition: all 0.3s ease;
        }
        .buzz-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }

        .blue { background: linear-gradient(to bottom, #0088cc, #005588); border-bottom: 4px solid #003355; }
        .yellow { background: linear-gradient(to bottom, #ffcc00, #cca000); border-bottom: 4px solid #886600; color: black; }
        .green { background: linear-gradient(to bottom, #2ee656, #1e9638); border-bottom: 4px solid #115520; }
        .purple { background: linear-gradient(to bottom, #9b59b6, #6c3483); border-bottom: 4px solid #4a235a; }

        #mobile-banner {
            position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; z-index: 100;
        }

        .wrong-answer {
            opacity: 0.2 !important;
            filter: grayscale(100%) !important;
        }
        
        .correct-answer {
            opacity: 1 !important;
            border: 3px solid #ffffff !important;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
            transform: scale(1.02);
        }

        #game-over-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; z-index: 200;
        }
    </style>
</head>
<body>

    <!-- BANNERS & OVERLAYS -->
    <div id="mobile-banner" style="display: none;">
        <h1 id="m-banner-title" style="color: #66fcf1;"></h1>
        <p id="m-banner-desc" style="color: #ffeb3b; font-size: 20px;"></p>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="game-over-screen" style="display: none;">
        <h1 style="font-size: 50px; margin: 0;">🏆</h1>
        <h2>Μεγάλος νικητής: <span id="winner-name" style="color: #66fcf1;"></span>!</h2>
        <div style="border: 2px dashed #f1c40f; padding: 15px; margin-top: 15px; border-radius: 10px; max-width: 90%;">
            <p id="winner-quote" style="font-style: italic; font-weight: bold; color: #f1c40f; font-size: 18px; margin: 0;"></p>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-box">
        <h2 style="color: #66fcf1;">PartyQuiz Controller</h2>
        <input type="text" id="room-input" placeholder="Κωδικός Δωματίου">
        <input type="text" id="name-input" placeholder="Το όνομά σου" maxlength="12">
        <button class="btn-join" onclick="joinGame()">ΣΥΝΔΕΣΗ</button>
        <p id="error-msg" style="color: #ff5252;"></p>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-screen" style="display: none;">
        <div class="buzz-controller">
            
            <div class="player-info">
                <span id="player-display">🎮 Παίκτης</span>
                <span id="score-display" style="color: #ffeb3b;">0 Πόντοι</span>
            </div>

            <div id="status-msg">🔴 Πατήστε το Buzzer για READY!</div>

            <button class="red-buzzer" onclick="vibrateAndSendBuzzer()"></button>

            <div class="buzz-buttons" id="buttons-grid">
                <button class="buzz-btn blue" id="btn-0" onclick="vibrateAndSendAnswer(0)"></button>
                <button class="buzz-btn yellow" id="btn-1" onclick="vibrateAndSendAnswer(1)"></button>
                <button class="buzz-btn green" id="btn-2" onclick="vibrateAndSendAnswer(2)"></button>
                <button class="buzz-btn purple" id="btn-3" onclick="vibrateAndSendAnswer(3)"></button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomId = '';
        let myName = '';
        let isChoosingCategory = false;

        // Αυτόματη συμπλήρωση του Room ID από το QR code URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) {
            document.getElementById('room-input').value = roomFromUrl;
        }

        // Αποφυγή scroll στο κινητό
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        function triggerVibration(pattern = 60) {
            if ("vibrate" in navigator) navigator.vibrate(pattern);
        }

        function joinGame() {
            const roomId = document.getElementById('room-input').value.trim();
            const playerName = document.getElementById('name-input').value.trim();

            if (!roomId || !playerName) {
                document.getElementById('error-msg').innerText = 'Συμπληρώστε όλα τα πεδία!';
                return;
            }

            currentRoomId = roomId;
            myName = playerName;
            socket.emit('join-room', { roomId, playerName });
        }

        function vibrateAndSendBuzzer() {
            triggerVibration(80);
            socket.emit('press-buzzer', { roomId: currentRoomId });
        }

        function vibrateAndSendAnswer(index) {
            triggerVibration(50);
            if (isChoosingCategory) {
                const catName = document.getElementById(`btn-${index}`).innerText;
                socket.emit('select-category', { roomId: currentRoomId, category: catName });
                isChoosingCategory = false;
                document.getElementById('status-msg').innerText = 'Κατηγορία καταχωρήθηκε! 🎯';
            } else {
                socket.emit('submit-answer', { roomId: currentRoomId, answerIndex: index });
                document.getElementById('status-msg').innerText = 'Απάντηση καταχωρήθηκε! ⏳';
            }
            document.getElementById('buttons-grid').style.pointerEvents = 'none';
        }

        socket.on('joined-successfully', (data) => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('player-display').innerText = `🎮 ${data.playerName}`;
            document.getElementById('buttons-grid').style.pointerEvents = 'none';
            triggerVibration(100);
        });

        socket.on('show-answer', (data) => {
            [0, 1, 2, 3].forEach((idx) => {
                const btn = document.getElementById(`btn-${idx}`);
                if (idx === data.correctIndex) {
                    btn.classList.add('correct-answer');
                    btn.classList.remove('wrong-answer');
                } else {
                    btn.classList.add('wrong-answer');
                    btn.classList.remove('correct-answer');
                }
            });
        });

        socket.on('ready-update', (data) => {
            document.getElementById('status-msg').innerText = `🔴 Πατήστε το Buzzer για READY! (${data.readyCount}/${data.totalCount})`;
        });

        socket.on('game-started-signal', () => {
            document.getElementById('status-msg').innerText = 'Το παιχνίδι ξεκινάει!';
        });

        socket.on('show-round-intro', (data) => {
            const banner = document.getElementById('mobile-banner');
            document.getElementById('m-banner-title').innerText = data.modeName;
            document.getElementById('m-banner-desc').innerText = data.desc;
            banner.style.display = 'flex';

            setTimeout(() => { banner.style.display = 'none'; }, 3200);
        });

        socket.on('prompt-category-selection', (data) => {
            if (data.isChooser) {
                isChoosingCategory = true;
                document.getElementById('status-msg').innerText = '🎯 ΔΙΑΛΕΞΤΕ ΚΑΤΗΓΟΡΙΑ!';
                document.getElementById('buttons-grid').style.pointerEvents = 'auto';

                data.categories.forEach((cat, idx) => {
                    const btn = document.getElementById(`btn-${idx}`);
                    btn.innerText = cat;
                    btn.classList.remove('correct-answer', 'wrong-answer');
                });
            } else {
                isChoosingCategory = false;
                document.getElementById('status-msg').innerText = `Ο/Η ${data.chooserName} επιλέγει...`;
                document.getElementById('buttons-grid').style.pointerEvents = 'none';
                [0,1,2,3].forEach(idx => {
                    const btn = document.getElementById(`btn-${idx}`);
                    btn.innerText = '';
                    btn.classList.remove('correct-answer', 'wrong-answer');
                });
            }
        });

        socket.on('new-question', (data) => {
            isChoosingCategory = false;
            document.getElementById('status-msg').innerText = 'Επιλέξτε απάντηση!';
            document.getElementById('buttons-grid').style.pointerEvents = 'auto';

            data.options.forEach((opt, idx) => {
                const btn = document.getElementById(`btn-${idx}`);
                btn.innerText = opt;
                btn.classList.remove('correct-answer', 'wrong-answer');
            });
        });

        socket.on('answer-recorded', (data) => {
            document.getElementById('status-msg').innerText = data.isCorrect ? 'Σωστό! 🎉' : 'Λάθος! ❌';
            triggerVibration(data.isCorrect ? [100, 50, 100] : [200]);
        });

        socket.on('update-single-player-score', (data) => {
            const scoreEl = document.getElementById('score-display');
            if (scoreEl) {
                if (data.timeLeft !== undefined && data.timeLeft !== null && data.timeLeft > 0) {
                    scoreEl.innerText = `⏳ ${data.timeLeft}s`;
                } else {
                    scoreEl.innerText = `${data.score} Πόντοι`;
                }
            }
        });

        socket.on('round-ended', () => {
            document.getElementById('status-msg').innerText = 'Τέλος Γύρου!';
            document.getElementById('buttons-grid').style.pointerEvents = 'none';
        });

        socket.on('update-final-timer', (players) => {
            const me = players.find(p => p.name === myName);
            if (me) {
                document.getElementById('score-display').innerText = `⏳ ${me.timeLeft}s`;
            }
        });

        socket.on('game-over', (data) => {
            document.getElementById('winner-name').innerText = data.winnerName;
            document.getElementById('winner-quote').innerText = data.quote;
            document.getElementById('game-over-screen').style.display = 'flex';
        });
    </script>
</body>
</html>
