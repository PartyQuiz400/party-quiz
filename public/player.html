<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartyQuiz - Παίκτης</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #121212; color: white; margin: 0; padding: 15px; }
        .btn { width: 100%; padding: 18px; margin: 10px 0; font-size: 20px; border-radius: 12px; border: none; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; }
        
        .btn-0 { background: #007bb5; border-bottom: 5px solid #004477; }
        .btn-1 { background: #ffcc00; color: black; text-shadow: none; border-bottom: 5px solid #998000; }
        .btn-2 { background: #28a745; border-bottom: 5px solid #145523; }
        .btn-3 { background: #8e44ad; border-bottom: 5px solid #4a235a; }

        .btn-diff { background: #1f2833; border: 2px solid #66fcf1; color: #66fcf1; padding: 12px; margin: 5px; font-size: 16px; border-radius: 8px; width: 45%; }
        .btn-diff.selected { background: #66fcf1; color: #0b0c10; font-weight: bold; }

        .btn:disabled { opacity: 0.6; filter: grayscale(50%); cursor: not-allowed; }
        .selected-answer { border: 4px solid #ffffff !important; transform: scale(0.98); }

        #buzzer-btn { background: #e74c3c; color: white; font-size: 28px; padding: 35px; border-radius: 50%; width: 180px; height: 180px; margin: 20px auto; border: 6px solid #c0392b; box-shadow: 0 0 20px #e74c3c; cursor: pointer; }
        #buzzer-btn:active { transform: scale(0.95); }

        .status-box { background: #1e1e1e; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 18px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="join-screen">
        <h2>Σύνδεση στο PartyQuiz</h2>
        <input type="text" id="player-name" placeholder="Το όνομά σου" style="width: 80%; padding: 12px; font-size: 18px; border-radius: 8px; border: none; margin-bottom: 15px;">
        <button onclick="joinGame()" class="btn btn-2">Είσοδος</button>
    </div>

    <div id="lobby-screen" style="display: none;">
        <div class="status-box">
            <h3 id="player-title" style="color: #66fcf1; margin: 0;"></h3>
            <p id="score-display">Πόντοι / Χρόνος: 0</p>
        </div>

        <div id="first-player-options" style="display: none; background: #1a1a2e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #66fcf1;">
            <h4 style="color: #ffeb3b; margin-top: 0;">🎯 Επιλογή Δυσκολίας (Είσαι ο Host Παίκτης)</h4>
            <div style="display: flex; flex-wrap: wrap; justify-content: center;">
                <button class="btn-diff selected" onclick="setDifficulty(1, this)">1 (Εύκολο)</button>
                <button class="btn-diff" onclick="setDifficulty(2, this)">2 (Μέτριο)</button>
                <button class="btn-diff" onclick="setDifficulty(3, this)">3 (Δύσκολο)</button>
                <button class="btn-diff" onclick="setDifficulty(4, this)">4 (Πολύ Δύσκολο)</button>
            </div>
        </div>

        <button id="buzzer-btn" onclick="pressBuzzer()">BUZZER</button>
        <p id="lobby-status-text" style="color: #aaa;">Πατήστε το Buzzer για να δηλώσετε 'Ετοιμος!</p>
    </div>

    <div id="category-screen" style="display: none;">
        <h3 id="category-prompt-text" style="color: #ffeb3b;"></h3>
        <div id="category-buttons-container"></div>
    </div>

    <div id="quiz-screen" style="display: none;">
        <div class="status-box">
            <span id="game-score-display" style="color: #66fcf1; font-weight: bold; font-size: 20px;">0</span>
        </div>
        <h3 id="question-wait-text" style="color: #ffeb3b;">🎧 Ακούστε την ερώτηση...</h3>
        <div id="answers-container"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="player.js"></script>
</body>
</html>
